# KreekCraft GTA 6 Clipping (Content Rewards). Rules read on 2026-11-20 from the campaign page,
# its Notion "Full Rules Brief" and Drive folder; the campaign page is the source of truth.
# The campaign states NO min/max length, NO disclosure wording and NO spoiler rule. The 20-60 s
# range is a safe choice (his own auto clips are 9-37 s). Paid disclosure and the 30-minute submit
# rule come only from Content Rewards' general guide, so they are kept as conservative defaults.
name: KreekCraft GTA 6 Clipping
type: cpm
platforms: [tiktok, instagram, youtube]
rate_per_1k_usd: 1.0
min_duration_s: 15  # campaign states no minimum; Ahmad 22 Nov: keep shorter okay clips (was 20)
max_duration_s: 60
required_hashtags: [ad, GTA6, KreekCraft, GrandTheftAutoVI]  # #ad in the caption is the paid disclosure (Ahmad, 21 Nov)
required_caption_phrases: ["Watch KreekCraft on YouTube and Twitch"]
# Logo must be visible for the ENTIRE clip (start to finish). Official asset: the "KreekCraft
# Overlay" file in the campaign's Drive folder (a 636 kB file; Ahmad downloads or approves it).
# Put it at campaigns/assets/kreekcraft-logo.png. Until it exists every
# clip is BLOCKED by the rules check - that is intentional.
required_overlay: kreekcraft-logo.png
disclosure_required: false  # Ahmad 21 Nov: no burned-in "#ad Paid partnership" and no platform paid-promotion switches; #ad in the caption only
disclosure_text: "#ad  Paid partnership"
disclosure_duration_s: 3
no_ai_visuals: false
today_only: false
spoiler_policy: light
swear_filter: bleep
submit_deadline_min: 30
audience_geo: ">=40% audience from US/UK/CA/AU"
min_engagement_pct: 0.8
max_similar_posts: 5
banned_topics: [leaked footage]
notes: >
  $1 CPM, $300 max per clip. Only KreekCraft's official GTA 6 streams/replays (YouTube or Twitch). No
  fabricated context, fake reactions or misleading titles. Original edits only. Hook in the first
  1-2 s. Clips must stay public 30 days. Engagement >= 0.8% with likes public.
  Merged from the setup chat's notes (docs/setup/kreekcraft-gta6.from-setup-chat.yaml, read 20 Nov):
  min payout $5 per clip (= 5,000 approved views); budget $6,045 left of $6,824; new accounts must
  follow the campaign's warmup process and the "Tier 1 audience-targeting guide" (not linked; likely
  in the campaign Discord) before submitting; low-effort screen recordings are prohibited.
