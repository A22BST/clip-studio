# PIPELINE TEST ONLY: uses a generated placeholder logo, not the real KreekCraft asset.
# Never post clips rendered with this file.
name: KreekCraft GTA 6 (pipeline test, placeholder overlay)
type: cpm
platforms: [tiktok, instagram, youtube]
rate_per_1k_usd: 1.0
min_duration_s: 15
max_duration_s: 60
required_hashtags: [GTA6, KreekCraft, GrandTheftAutoVI]
required_caption_phrases: ["Watch KreekCraft on YouTube and Twitch"]
# Logo must be visible for the ENTIRE clip. Put the official asset (from the campaign's
# reference materials) at campaigns/assets/kreekcraft-logo.png. Until it exists every
# clip is BLOCKED by the rules check - that is intentional.
required_overlay: placeholder-logo.png
disclosure_required: true
disclosure_text: "#ad  Paid partnership"
disclosure_duration_s: 3
no_ai_visuals: false
today_only: false
spoiler_policy: light
swear_filter: bleep
submit_deadline_min: 30
audience_geo: ">=40% audience from US/UK/CA/AU"
min_engagement_pct: 0.8
max_similar_posts: 5
banned_topics: [leaked footage]
notes: >
  Only KreekCraft's official GTA 6 streams/replays. Original edits only. Hook in the first
  1-2 s. Clips must stay public 30 days. Engagement >= 0.8% with likes public.
